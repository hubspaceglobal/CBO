<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Sustainability Scorecard — CBO HubSpace</title>
  <meta name="description" content="Take the free 5-minute Church Sustainability Scorecard and get a personalized action plan for your congregation.">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Montserrat', sans-serif; background: #F7F4FB; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef } = React;

    const B = {
      purple: "#3B0764", purpleLight: "#5C1A8E", purpleFade: "#F3EDF9",
      red: "#A31621", redLight: "#C41E2E", redFade: "#FDEAEC",
      ink: "#1A0A2E", mist: "#F7F4FB", silver: "#E8E2F0", slate: "#6B5E82",
      white: "#FFFFFF", gold: "#C8963E",
    };

    const LogoMark = ({ size = 48 }) => (
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
        <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" fill={B.purple} />
        <clipPath id="leftHalf"><rect x="0" y="0" width="50" height="100" /></clipPath>
        <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" fill={B.red} clipPath="url(#leftHalf)" />
        <rect x="47" y="4" width="6" height="92" fill={B.white} opacity="0.15" />
        <polygon points="50,28 67,50 50,72 33,50" fill={B.white} opacity="0.92" />
        <clipPath id="diamondTop"><rect x="0" y="0" width="100" height="50" /></clipPath>
        <polygon points="50,28 67,50 50,72 33,50" fill={B.red} opacity="0.18" clipPath="url(#diamondTop)" />
        <circle cx="50" cy="50" r="6" fill={B.purple} />
      </svg>
    );

    const DOMAINS = [
      { id: "financial", label: "Financial Health", color: B.purple, questions: [
        "Giving has been stable or growing over the past 12–24 months",
        "The church operates within a balanced or surplus budget",
        "Less than 20–30% of income comes from a single donor or source",
        "The church has at least 3–6 months of cash reserves",
        "Debt is manageable and not restricting ministry",
      ]},
      { id: "attendance", label: "Attendance & Engagement", color: "#6B21A8", questions: [
        "Weekly attendance is stable or increasing",
        "First-time visitors are converting into regular attendees",
        "A meaningful percentage of attendees are involved in groups or serving",
        "The volunteer base is sufficient and not overextended",
      ]},
      { id: "demographics", label: "Demographics & Growth", color: B.red, questions: [
        "Age distribution includes younger generations (under 40)",
        "Growth is not dependent on a single demographic group",
        "The church reflects or can reach its surrounding community",
      ]},
      { id: "leadership", label: "Leadership & Governance", color: "#7C3AED", questions: [
        "Senior leadership is stable and effective",
        "There is a clear succession or contingency plan",
        "Leadership responsibilities are distributed, not centralized in one person",
        "There is an active pipeline for developing new leaders",
      ]},
      { id: "facilities", label: "Facilities & Operations", color: "#9D174D", questions: [
        "Facilities are affordable relative to budget",
        "Space is well-utilized beyond Sunday services",
        "Major maintenance issues are under control",
      ]},
      { id: "mission", label: "Mission & Impact", color: "#4C1D95", questions: [
        "The church has a clear, communicated mission",
        "Programs align with mission and produce visible outcomes",
        "The church has measurable community impact",
      ]},
      { id: "digital", label: "Digital & Adaptability", color: "#BE185D", questions: [
        "Online presence engages people beyond physical attendance",
        "The church adapts to change across culture, technology, and community needs",
      ]},
    ];

    const TOTAL_MAX = DOMAINS.reduce((a, d) => a + d.questions.length * 5, 0);

    function getBand(score) {
      if (score >= 90) return { label: "Strongly Sustainable", color: "#15803D", bg: "#F0FDF4" };
      if (score >= 70) return { label: "Stable — Needs Attention", color: "#B45309", bg: "#FFFBEB" };
      if (score >= 50) return { label: "At Risk — Intervention Needed", color: B.red, bg: B.redFade };
      return { label: "Unsustainable Trajectory", color: "#7F1D1D", bg: "#FEF2F2" };
    }

    function getDomainRec(domain, score, max) {
      const pct = score / max;
      if (pct >= 0.85) return null;
      if (pct >= 0.70) {
        const tips = {
          financial: "Review budget variance quarterly and consider expanding your donor base.",
          attendance: "Implement a structured follow-up process for first-time visitors.",
          demographics: "Launch a targeted outreach initiative for under-40 community members.",
          leadership: "Formalize your succession plan and document leadership responsibilities.",
          facilities: "Conduct an annual space utilization audit to optimize facility use.",
          mission: "Establish measurable KPIs for each program aligned to your mission statement.",
          digital: "Develop a content calendar to maintain consistent online engagement.",
        };
        return { level: "monitor", text: tips[domain.id] };
      }
      const urgent = {
        financial: "Immediate action required: conduct a full financial audit and develop a 90-day stabilization plan. Diversify revenue streams.",
        attendance: "Retention is critical. Implement a connection pathway and assign a dedicated assimilation team.",
        demographics: "Demographic concentration poses long-term risk. Engage community leaders to broaden reach.",
        leadership: "Leadership centralization is a critical vulnerability. Begin distributed governance planning now.",
        facilities: "Facilities costs may be unsustainable. Evaluate lease/ownership options and shared-use partnerships.",
        mission: "Mission clarity is foundational. Facilitate a leadership retreat to realign programs with core purpose.",
        digital: "Digital presence is insufficient for modern engagement. Allocate resources to a managed digital strategy.",
      };
      return { level: "urgent", text: urgent[domain.id] };
    }

    const inputStyle = {
      width: "100%", padding: "10px 14px", border: `1.5px solid ${B.silver}`,
      borderRadius: 8, fontSize: 14, fontFamily: "inherit", color: B.ink,
      background: B.white, outline: "none", boxSizing: "border-box",
    };

    function App() {
      const [phase, setPhase] = useState("intro");
      const [contact, setContact] = useState({
        churchName: "", city: "", state: "", denomination: "",
        contactName: "", contactEmail: "",
        date: new Date().toISOString().slice(0, 10),
      });
      const [scores, setScores] = useState({});
      const [domainIdx, setDomainIdx] = useState(0);
      const topRef = useRef(null);

      const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);

      function setScore(domainId, qIdx, val) {
        setScores(s => ({ ...s, [`${domainId}_${qIdx}`]: val }));
      }

      function domainScore(domain) {
        return domain.questions.reduce((a, _, i) => a + (scores[`${domain.id}_${i}`] || 0), 0);
      }

      function canProceed() {
        const d = DOMAINS[domainIdx];
        return d.questions.every((_, i) => scores[`${d.id}_${i}`]);
      }

      function nextDomain() {
        if (domainIdx < DOMAINS.length - 1) {
          setDomainIdx(domainIdx + 1);
          topRef.current?.scrollIntoView({ behavior: "smooth" });
        } else {
          setPhase("results");
          topRef.current?.scrollIntoView({ behavior: "smooth" });
        }
      }

      function downloadJSON() {
        const payload = { contact, scores, totalScore, maxScore: TOTAL_MAX, generatedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${contact.churchName || "church"}-scorecard.json`;
        a.click();
      }

      const band = getBand(totalScore);

      // ── INTRO ──────────────────────────────────────────────────────────────
      if (phase === "intro") return (
        <div style={{ minHeight: "100vh", background: B.purple, fontFamily: "Georgia, serif", display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "32px 40px", display: "flex", alignItems: "center", gap: 16 }}>
            <LogoMark size={52} />
            <div>
              <div style={{ color: B.white, fontSize: 11, letterSpacing: 4, textTransform: "uppercase", opacity: 0.7, fontFamily: "Arial, sans-serif" }}>CBO HUBSPACE</div>
              <div style={{ color: B.white, fontSize: 13, letterSpacing: 2, textTransform: "uppercase", opacity: 0.55, fontFamily: "Arial, sans-serif" }}>Community Based Organizations</div>
            </div>
          </div>

          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "60px 24px", textAlign: "center" }}>
            <div style={{ maxWidth: 680 }}>
              <div style={{ width: 60, height: 3, background: B.red, margin: "0 auto 32px", borderRadius: 2 }} />
              <h1 style={{ color: B.white, fontSize: "clamp(32px,5vw,54px)", fontWeight: 400, lineHeight: 1.2, margin: "0 0 24px" }}>
                Church Sustainability<br />Scorecard
              </h1>
              <p style={{ color: "rgba(255,255,255,0.72)", fontSize: 17, lineHeight: 1.75, margin: "0 0 48px", fontFamily: "Arial, sans-serif", fontWeight: 300 }}>
                A structured assessment across seven organizational domains — financial health, attendance, demographics, leadership, facilities, mission, and adaptability — to help faith communities understand their long-term viability and take informed action.
              </p>
              <div style={{ display: "flex", gap: 24, justifyContent: "center", flexWrap: "wrap", marginBottom: 48 }}>
                {[["24","Questions"],["7","Domains"],["~10 min","to Complete"]].map(([n,l]) => (
                  <div key={l} style={{ textAlign: "center" }}>
                    <div style={{ color: B.white, fontSize: 36, fontWeight: 300 }}>{n}</div>
                    <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 12, letterSpacing: 2, textTransform: "uppercase", fontFamily: "Arial, sans-serif" }}>{l}</div>
                  </div>
                ))}
              </div>
              <button
                onClick={() => setPhase("form")}
                style={{ background: B.red, color: B.white, border: "none", borderRadius: 999, padding: "18px 56px", fontSize: 15, letterSpacing: 2, textTransform: "uppercase", cursor: "pointer", fontFamily: "Arial, sans-serif", fontWeight: 600 }}
              >
                Begin Assessment
              </button>
            </div>
          </div>

          <div style={{ background: "rgba(0,0,0,0.25)", padding: "24px 40px" }}>
            <div style={{ maxWidth: 800, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 16 }}>
              {[
                { range: "90–120", label: "Strongly Sustainable", color: "#22C55E" },
                { range: "70–89", label: "Stable — Needs Attention", color: "#F59E0B" },
                { range: "50–69", label: "At Risk", color: "#EF4444" },
                { range: "Below 50", label: "Unsustainable", color: "#7F1D1D" },
              ].map(b => (
                <div key={b.range} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 10, height: 10, borderRadius: "50%", background: b.color, flexShrink: 0 }} />
                  <div>
                    <div style={{ color: B.white, fontSize: 13, fontFamily: "Arial, sans-serif" }}>{b.range}</div>
                    <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 11, fontFamily: "Arial, sans-serif" }}>{b.label}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // ── CONTACT FORM ──────────────────────────────────────────────────────
      if (phase === "form") return (
        <div style={{ minHeight: "100vh", background: B.mist, fontFamily: "Arial, sans-serif" }} ref={topRef}>
          <div style={{ background: B.purple, padding: "20px 40px", display: "flex", alignItems: "center", gap: 14 }}>
            <LogoMark size={36} />
            <span style={{ color: "rgba(255,255,255,0.6)", fontSize: 12, letterSpacing: 3, textTransform: "uppercase" }}>Church Sustainability Scorecard</span>
          </div>
          <div style={{ maxWidth: 600, margin: "0 auto", padding: "64px 24px" }}>
            <div style={{ marginBottom: 40 }}>
              <div style={{ width: 40, height: 3, background: B.red, borderRadius: 2, marginBottom: 20 }} />
              <h2 style={{ fontSize: 28, fontWeight: 400, color: B.ink, fontFamily: "Georgia, serif", margin: "0 0 12px" }}>Organization Information</h2>
              <p style={{ color: B.slate, fontSize: 14, lineHeight: 1.7, margin: 0 }}>This information personalizes your scorecard report. Fields are stored only in your browser session.</p>
            </div>
            <div style={{ display: "grid", gap: 20 }}>
              {[
                { key: "churchName", label: "Church Name *", placeholder: "Full legal or operating name", span: 2 },
                { key: "city", label: "City", placeholder: "City" },
                { key: "state", label: "State / Region", placeholder: "State or Province" },
                { key: "denomination", label: "Denomination / Network", placeholder: "e.g. Baptist, Non-denominational…", span: 2 },
                { key: "contactName", label: "Contact Name", placeholder: "Your full name" },
                { key: "contactEmail", label: "Contact Email *", placeholder: "your@email.com" },
                { key: "date", label: "Assessment Date", type: "date", span: 2 },
              ].map(f => (
                <div key={f.key} style={{ gridColumn: f.span === 2 ? "1 / -1" : "auto" }}>
                  <label style={{ display: "block", fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", color: B.slate, marginBottom: 8, fontWeight: 600 }}>{f.label}</label>
                  <input
                    type={f.type || "text"}
                    placeholder={f.placeholder}
                    value={contact[f.key]}
                    onChange={e => setContact(c => ({ ...c, [f.key]: e.target.value }))}
                    style={inputStyle}
                  />
                </div>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 40 }}>
              <button
                onClick={() => setPhase("intro")}
                style={{ background: "transparent", border: `1.5px solid ${B.silver}`, borderRadius: 999, padding: "14px", color: B.slate, fontSize: 13, letterSpacing: 1, textTransform: "uppercase", cursor: "pointer" }}
              >Back</button>
              <button
                onClick={() => { setPhase("survey"); setDomainIdx(0); }}
                disabled={!contact.churchName || !contact.contactEmail}
                style={{ background: contact.churchName && contact.contactEmail ? B.purple : B.silver, color: B.white, border: "none", borderRadius: 999, padding: "14px", fontSize: 13, letterSpacing: 1, textTransform: "uppercase", cursor: contact.churchName && contact.contactEmail ? "pointer" : "default", fontWeight: 600 }}
              >Continue to Assessment</button>
            </div>
          </div>
        </div>
      );

      // ── SURVEY ────────────────────────────────────────────────────────────
      if (phase === "survey") {
        const domain = DOMAINS[domainIdx];
        const progress = (domainIdx / DOMAINS.length) * 100;
        return (
          <div style={{ minHeight: "100vh", background: B.mist, fontFamily: "Arial, sans-serif" }} ref={topRef}>
            <div style={{ background: B.purple, padding: "20px 40px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <LogoMark size={36} />
                <span style={{ color: "rgba(255,255,255,0.6)", fontSize: 12, letterSpacing: 3, textTransform: "uppercase" }}>Church Sustainability Scorecard</span>
              </div>
              <span style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>{contact.churchName}</span>
            </div>
            <div style={{ height: 4, background: B.silver }}>
              <div style={{ height: 4, background: `linear-gradient(to right,${B.red},${B.purple})`, width: `${progress}%`, transition: "width 0.5s ease" }} />
            </div>
            <div style={{ background: B.white, borderBottom: `1px solid ${B.silver}`, padding: "0 24px", overflowX: "auto" }}>
              <div style={{ display: "flex", maxWidth: 900, margin: "0 auto" }}>
                {DOMAINS.map((d, i) => {
                  const done = d.questions.every((_, qi) => scores[`${d.id}_${qi}`]);
                  return (
                    <div key={d.id} onClick={() => i <= domainIdx && setDomainIdx(i)} style={{ padding: "16px 12px 14px", borderBottom: i === domainIdx ? `3px solid ${B.red}` : "3px solid transparent", cursor: i <= domainIdx ? "pointer" : "default", opacity: i > domainIdx ? 0.4 : 1, whiteSpace: "nowrap", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: i === domainIdx ? B.red : B.slate, fontWeight: i === domainIdx ? 700 : 400, display: "flex", alignItems: "center", gap: 6 }}>
                      {done && i !== domainIdx && <span style={{ color: "#22C55E", fontSize: 10 }}>✓</span>}
                      {d.label}
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{ maxWidth: 760, margin: "0 auto", padding: "48px 24px" }}>
              <div style={{ marginBottom: 40 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                  <div style={{ width: 6, height: 36, background: domain.color, borderRadius: 3 }} />
                  <div>
                    <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: B.slate, marginBottom: 4 }}>Domain {domainIdx + 1} of {DOMAINS.length}</div>
                    <h2 style={{ fontFamily: "Georgia, serif", fontSize: 26, fontWeight: 400, color: B.ink, margin: 0 }}>{domain.label}</h2>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  {[
                    { val: 1, label: "Critical Risk", desc: "Absent, failing, or immediate threat", color: B.red },
                    { val: 3, label: "Developing", desc: "In progress but inconsistent", color: "#B45309" },
                    { val: 5, label: "Performing", desc: "Established and functioning well", color: "#15803D" },
                  ].map(r => (
                    <div key={r.val} style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 14px", background: B.white, borderRadius: 8, border: `1px solid ${B.silver}`, flex: "1 1 180px" }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: r.color, marginTop: 4, flexShrink: 0 }} />
                      <div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: r.color }}>{r.label}</div>
                        <div style={{ fontSize: 11, color: B.slate, lineHeight: 1.5, marginTop: 2 }}>{r.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
                {domain.questions.map((q, qi) => {
                  const key = `${domain.id}_${qi}`;
                  const val = scores[key];
                  return (
                    <div key={qi} style={{ background: B.white, borderRadius: 12, padding: "28px 32px", border: `1px solid ${B.silver}`, boxShadow: "0 1px 4px rgba(59,7,100,0.06)" }}>
                      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", marginBottom: 24 }}>
                        <div style={{ width: 28, height: 28, borderRadius: "50%", background: val ? domain.color : B.silver, color: B.white, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{qi + 1}</div>
                        <p style={{ margin: 0, fontSize: 15, lineHeight: 1.65, color: B.ink, fontFamily: "Georgia, serif" }}>{q}</p>
                      </div>
                      <div style={{ display: "flex", gap: 12 }}>
                        {[
                          { val: 1, label: "Critical Risk", color: B.red, selBg: B.red },
                          { val: 3, label: "Developing", color: "#B45309", selBg: "#D97706" },
                          { val: 5, label: "Performing", color: "#15803D", selBg: "#16A34A" },
                        ].map(opt => {
                          const selected = val === opt.val;
                          return (
                            <button key={opt.val} onClick={() => setScore(domain.id, qi, opt.val)} style={{ flex: 1, padding: "16px 12px", border: selected ? `2px solid ${opt.selBg}` : `1.5px solid ${B.silver}`, borderRadius: 10, background: selected ? opt.selBg : B.white, cursor: "pointer", textAlign: "center", transition: "all 0.15s", boxShadow: selected ? `0 2px 12px ${opt.selBg}44` : "none" }}>
                              <div style={{ fontSize: 13, fontWeight: 700, color: selected ? B.white : opt.color }}>{opt.label}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 40, justifyContent: "space-between" }}>
                <button onClick={() => domainIdx === 0 ? setPhase("form") : setDomainIdx(domainIdx - 1)} style={{ background: "transparent", border: `1.5px solid ${B.silver}`, borderRadius: 999, padding: "14px 36px", color: B.slate, fontSize: 13, letterSpacing: 1, textTransform: "uppercase", cursor: "pointer" }}>Back</button>
                <button onClick={nextDomain} disabled={!canProceed()} style={{ background: canProceed() ? B.purple : B.silver, color: B.white, border: "none", borderRadius: 999, padding: "14px 44px", fontSize: 13, letterSpacing: 1, textTransform: "uppercase", cursor: canProceed() ? "pointer" : "default", fontWeight: 600 }}>
                  {domainIdx < DOMAINS.length - 1 ? "Next Domain" : "View Results"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ── RESULTS ───────────────────────────────────────────────────────────
      if (phase === "results") {
        const pct = Math.round((totalScore / TOTAL_MAX) * 100);
        return (
          <div style={{ minHeight: "100vh", background: B.mist, fontFamily: "Arial, sans-serif" }} ref={topRef}>
            <div style={{ background: B.purple, padding: "20px 40px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <LogoMark size={36} />
                <span style={{ color: "rgba(255,255,255,0.6)", fontSize: 12, letterSpacing: 3, textTransform: "uppercase" }}>Scorecard Results</span>
              </div>
              <div style={{ display: "flex", gap: 12 }}>
                <button onClick={() => { setPhase("survey"); setDomainIdx(DOMAINS.length - 1); topRef.current?.scrollIntoView({ behavior: "smooth" }); }} style={{ background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 999, color: B.white, padding: "8px 22px", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", cursor: "pointer" }}>Back</button>
                <button onClick={downloadJSON} style={{ background: B.red, border: "none", borderRadius: 999, color: B.white, padding: "8px 22px", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", cursor: "pointer", fontWeight: 700 }}>Download Report</button>
              </div>
            </div>

            <div style={{ maxWidth: 900, margin: "0 auto", padding: "48px 24px" }}>
              {/* Hero score */}
              <div style={{ background: B.purple, borderRadius: 16, padding: "48px", marginBottom: 32, position: "relative", overflow: "hidden" }}>
                <div style={{ position: "absolute", top: 0, right: 0, width: 320, height: 320, borderRadius: "50%", background: "rgba(163,22,33,0.12)", transform: "translate(80px,-80px)" }} />
                <div style={{ position: "relative", zIndex: 1 }}>
                  <div style={{ fontSize: 11, letterSpacing: 3, textTransform: "uppercase", color: "rgba(255,255,255,0.5)", marginBottom: 8 }}>
                    {new Date(contact.date + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}
                  </div>
                  <div style={{ display: "flex", alignItems: "flex-end", gap: 24, flexWrap: "wrap", marginBottom: 24 }}>
                    <div>
                      <div style={{ fontSize: 80, fontWeight: 200, color: B.white, lineHeight: 1, fontFamily: "Georgia, serif" }}>{totalScore}</div>
                      <div style={{ color: "rgba(255,255,255,0.45)", fontSize: 14 }}>out of {TOTAL_MAX} possible points</div>
                    </div>
                    <div style={{ background: band.bg, borderRadius: 8, padding: "12px 20px", marginBottom: 4 }}>
                      <div style={{ color: band.color, fontSize: 18, fontWeight: 700, fontFamily: "Georgia, serif" }}>{band.label}</div>
                      <div style={{ color: band.color, fontSize: 12, opacity: 0.8 }}>{pct}% of maximum score</div>
                    </div>
                  </div>
                  <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 4, height: 8, overflow: "hidden" }}>
                    <div style={{ width: `${pct}%`, height: 8, background: `linear-gradient(to right,${B.red},#C084FC)`, borderRadius: 4 }} />
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 10, color: "rgba(255,255,255,0.35)", letterSpacing: 1 }}>
                    <span>0</span><span>50 — At Risk</span><span>70 — Stable</span><span>90 — Sustainable</span><span>120</span>
                  </div>
                </div>
              </div>

              {/* Domain breakdown */}
              <div style={{ marginBottom: 32 }}>
                <h3 style={{ fontFamily: "Georgia, serif", fontSize: 20, fontWeight: 400, color: B.ink, marginBottom: 24 }}>Domain Breakdown</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {DOMAINS.map(domain => {
                    const ds = domainScore(domain);
                    const dmax = domain.questions.length * 5;
                    const dpct = Math.round((ds / dmax) * 100);
                    const rec = getDomainRec(domain, ds, dmax);
                    return (
                      <div key={domain.id} style={{ background: B.white, borderRadius: 12, padding: "24px 28px", border: `1px solid ${B.silver}`, boxShadow: "0 1px 4px rgba(59,7,100,0.06)" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 12, flexWrap: "wrap" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ width: 4, height: 20, background: domain.color, borderRadius: 2 }} />
                            <span style={{ fontWeight: 600, color: B.ink, fontSize: 14 }}>{domain.label}</span>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                            <span style={{ fontSize: 13, color: B.slate }}>{ds} / {dmax}</span>
                            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1, padding: "3px 10px", borderRadius: 20, background: dpct >= 85 ? "#F0FDF4" : dpct >= 70 ? "#FFFBEB" : B.redFade, color: dpct >= 85 ? "#15803D" : dpct >= 70 ? "#B45309" : B.red }}>
                              {dpct >= 85 ? "STRONG" : dpct >= 70 ? "MONITOR" : "URGENT"}
                            </span>
                          </div>
                        </div>
                        <div style={{ background: B.silver, borderRadius: 4, height: 6, overflow: "hidden", marginBottom: rec ? 16 : 0 }}>
                          <div style={{ width: `${dpct}%`, height: 6, background: domain.color, borderRadius: 4 }} />
                        </div>
                        {rec && (
                          <div style={{ marginTop: 14, padding: "12px 16px", background: rec.level === "urgent" ? B.redFade : "#FFFBEB", borderLeft: `3px solid ${rec.level === "urgent" ? B.red : "#F59E0B"}`, borderRadius: "0 6px 6px 0" }}>
                            <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", fontWeight: 700, color: rec.level === "urgent" ? B.red : "#B45309", marginBottom: 4 }}>
                              {rec.level === "urgent" ? "Recommendation — Urgent" : "Recommendation — Monitor"}
                            </div>
                            <div style={{ fontSize: 13, color: B.ink, lineHeight: 1.6 }}>{rec.text}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Question detail */}
              <div style={{ marginBottom: 32 }}>
                <h3 style={{ fontFamily: "Georgia, serif", fontSize: 20, fontWeight: 400, color: B.ink, marginBottom: 24 }}>Question-Level Detail</h3>
                {DOMAINS.map(domain => (
                  <div key={domain.id} style={{ marginBottom: 24 }}>
                    <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: domain.color, fontWeight: 700, marginBottom: 12, paddingBottom: 8, borderBottom: `1px solid ${B.silver}` }}>{domain.label}</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {domain.questions.map((q, qi) => {
                        const s = scores[`${domain.id}_${qi}`] || 0;
                        const labels = { 0: "—", 1: "Critical Risk", 3: "Developing", 5: "Performing" };
                        const scoreColors = { 1: B.red, 3: "#D97706", 5: "#15803D" };
                        return (
                          <div key={qi} style={{ display: "flex", gap: 16, alignItems: "flex-start", padding: "12px 0", borderBottom: `1px solid ${B.silver}` }}>
                            <div style={{ width: 28, height: 28, borderRadius: "50%", background: scoreColors[s] || B.silver, color: B.white, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, flexShrink: 0 }}>
                              {s === 1 ? "CR" : s === 3 ? "DV" : s === 5 ? "PF" : "—"}
                            </div>
                            <div style={{ flex: 1, fontSize: 13, color: B.ink, lineHeight: 1.5, paddingTop: 4 }}>{q}</div>
                            <div style={{ fontSize: 11, color: scoreColors[s] || B.slate, fontWeight: 600, flexShrink: 0, paddingTop: 6 }}>{labels[s]}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>

              {/* CTA */}
              <div style={{ background: B.purple, borderRadius: 12, padding: "32px", textAlign: "center" }}>
                <div style={{ color: "rgba(255,255,255,0.6)", fontSize: 12, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Next Steps</div>
                <p style={{ color: B.white, fontSize: 15, lineHeight: 1.7, margin: "0 0 28px", maxWidth: 560, marginLeft: "auto", marginRight: "auto" }}>
                  Share this scorecard with your leadership team or board. Download the data to track progress over time. Re-assess in 3–6 months to measure improvement.
                </p>
                <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
                  <button onClick={downloadJSON} style={{ background: B.red, border: "none", borderRadius: 999, color: B.white, padding: "12px 28px", fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", cursor: "pointer", fontWeight: 700 }}>Download Report</button>
                  <a href="index.html#contact" style={{ background: B.white, border: "none", borderRadius: 999, color: B.purple, padding: "12px 28px", fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", fontWeight: 700, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>Connect With Us</a>
                </div>
              </div>

              {/* Footer */}
              <div style={{ textAlign: "center", marginTop: 40, paddingTop: 24, borderTop: `1px solid ${B.silver}` }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 8 }}>
                  <LogoMark size={24} />
                  <span style={{ fontSize: 11, letterSpacing: 2, color: B.slate, textTransform: "uppercase" }}>CBO HubSpace · Community Based Organizations</span>
                </div>
                <p style={{ fontSize: 11, color: B.slate, opacity: 0.6, margin: 0 }}>This scorecard is an organizational self-assessment tool. Results are for internal planning purposes only.</p>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
