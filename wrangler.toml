name = "cbohub"
main = "stripe-webhook.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Public vars (non-sensitive) ──────────────────────────────
# Replace with your actual Supabase project URL
[vars]
SUPABASE_URL = "https://qummleodrnuyudauxnpa.supabase.co"

# ── Secrets ──────────────────────────────────────────────────
# Do NOT put secret values here. Set them via CLI:
#
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put SUPABASE_SERVICE_KEY
#
# STRIPE_WEBHOOK_SECRET → Stripe Dashboard → Developers → Webhooks → Signing secret
# SUPABASE_SERVICE_KEY  → Supabase → Project Settings → API → service_role key

# ── Routes ───────────────────────────────────────────────────
# The Worker will be reachable at:
#   https://cbo-stripe-webhook.YOUR-ACCOUNT.workers.dev
#
# Register this URL as your webhook endpoint in Stripe:
#   Stripe → Developers → Webhooks → Add Endpoint
